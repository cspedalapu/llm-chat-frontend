services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-chat-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHAT_DATA_DIR: /app/data
    volumes:
      - workspace-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    profiles: ["dev"]
    depends_on:
      - backend
    build:
      context: ./frontend
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  frontend-prod:
    depends_on:
      - backend
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  workspace-data:
