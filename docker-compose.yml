# Host ports can be changed without editing this file, e.g. when another project
# already uses 8000:  BACKEND_PORT=8001 docker compose --profile dev up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-chat-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      CHAT_DATA_DIR: /app/data
      # Research tab (see .env.example). Empty values leave the feature off.
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://localhost:5173}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-common}
      RESEARCH_CONTACT_EMAIL: ${RESEARCH_CONTACT_EMAIL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      RESEARCH_ALLOW_PRIVATE_NETWORK: ${RESEARCH_ALLOW_PRIVATE_NETWORK:-}
    volumes:
      - workspace-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    profiles: ["dev"]
    depends_on:
      - backend
    build:
      context: ./frontend
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  frontend-prod:
    profiles: ["prod"]
    depends_on:
      - backend
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PROD_PORT:-8080}:8080"

volumes:
  workspace-data:
